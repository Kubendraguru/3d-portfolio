<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="webflowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#0B1325" />
    </linearGradient>
    <linearGradient id="neonWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <linearGradient id="glassCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Dark Card Background with zero white borders -->
  <rect width="460" height="280" rx="18" fill="url(#webflowBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Code Header -->
  <text x="24" y="36" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">// WEBFLOW_DEVELOPMENT</text>

  <!-- Left: Glowing 3D Webflow Cube -->
  <g transform="translate(18, 90)">
    <rect width="52" height="52" rx="14" fill="url(#glassCube)" stroke="#60A5FA" stroke-width="1.8" filter="url(#blueGlow)" opacity="0.9" />
    <rect width="52" height="52" rx="14" fill="url(#glassCube)" stroke="#93C5FD" stroke-width="1.2" />
    <text x="14" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="900" font-style="italic">W</text>
  </g>

  <!-- Center-Right: 3D Laptop with Webflow Builder Screen -->
  <g transform="translate(80, 50)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="280" height="175" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="2" />
    <!-- Screen Display -->
    <rect x="6" y="6" width="268" height="163" rx="8" fill="url(#laptopScreen)" />

    <!-- Browser Header -->
    <circle cx="16" cy="16" r="2.5" fill="#EF4444" />
    <circle cx="24" cy="16" r="2.5" fill="#F59E0B" />
    <circle cx="32" cy="16" r="2.5" fill="#10B981" />
    <text x="44" y="19" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="700">webflow</text>

    <text x="145" y="18" fill="#64748B" font-family="sans-serif" font-size="7">Home</text>
    <text x="175" y="18" fill="#64748B" font-family="sans-serif" font-size="7">Work</text>
    <text x="202" y="18" fill="#64748B" font-family="sans-serif" font-size="7">About</text>
    <rect x="228" y="10" width="40" height="13" rx="4" fill="#2563EB" />
    <text x="233" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="6" font-weight="600">Get in touch</text>

    <!-- Sidebar Tools -->
    <rect x="6" y="26" width="18" height="143" fill="#0B1326" />
    <rect x="9" y="32" width="12" height="12" rx="3" fill="#2563EB" />
    <text x="12" y="41" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="800">W</text>
    <circle cx="15" cy="54" r="3" fill="#475569" />
    <rect x="12" y="64" width="6" height="6" fill="#475569" />
    <rect x="12" y="76" width="6" height="6" rx="1" fill="#475569" />

    <!-- Hero Content -->
    <g transform="translate(32, 35)">
      <text x="0" y="15" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Build stunning</text>
      <text x="0" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">websites</text>
      <text x="0" y="39" fill="#94A3B8" font-family="sans-serif" font-size="6.5">Design, build, and launch powerful</text>
      <text x="0" y="47" fill="#94A3B8" font-family="sans-serif" font-size="6.5">websites visually — no code.</text>

      <rect x="0" y="54" width="58" height="15" rx="4" fill="#2563EB" />
      <text x="6" y="64" fill="#FFFFFF" font-family="sans-serif" font-size="6.5" font-weight="700">Launch Your Site</text>

      <!-- Glowing 3D Fluid Wave -->
      <path d="M75 55 C85 20, 105 8, 120 28 C135 48, 145 15, 160 30" fill="none" stroke="url(#neonWave)" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)" />
      <path d="M80 60 C90 30, 110 18, 125 35 C140 52, 150 25, 165 40" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- CMS Collections Floating Window -->
    <g transform="translate(182, 65)">
      <rect width="84" height="62" rx="6" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="14" fill="#E2E8F0" font-family="sans-serif" font-size="6.5" font-weight="700">CMS Collections</text>
      <rect x="8" y="22" width="68" height="8" rx="2" fill="#1E293B" />
      <text x="12" y="28" fill="#94A3B8" font-family="sans-serif" font-size="5.5">Projects (24)</text>
      <rect x="8" y="33" width="68" height="8" rx="2" fill="#1E293B" />
      <text x="12" y="39" fill="#94A3B8" font-family="sans-serif" font-size="5.5">Blog Posts (18)</text>
      <rect x="8" y="44" width="68" height="8" rx="2" fill="#1E293B" />
      <text x="12" y="50" fill="#94A3B8" font-family="sans-serif" font-size="5.5">Testimonials (36)</text>
    </g>

    <!-- Bottom Metrics -->
    <g transform="translate(32, 128)">
      <rect x="0" y="0" width="42" height="28" rx="4" fill="#0B1329" stroke="#1E293B" stroke-width="0.8" />
      <text x="5" y="11" fill="#64748B" font-family="sans-serif" font-size="5.5">Projects</text>
      <text x="5" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">24</text>
      <path d="M22 20 L27 16 L32 18 L37 14" fill="none" stroke="#3B82F6" stroke-width="1.2" />

      <rect x="47" y="0" width="42" height="28" rx="4" fill="#0B1329" stroke="#1E293B" stroke-width="0.8" />
      <text x="52" y="11" fill="#64748B" font-family="sans-serif" font-size="5.5">Clients</text>
      <text x="52" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">18</text>
      <path d="M69 20 L74 16 L79 18 L84 14" fill="none" stroke="#10B981" stroke-width="1.2" />

      <rect x="94" y="0" width="42" height="28" rx="4" fill="#0B1329" stroke="#1E293B" stroke-width="0.8" />
      <text x="99" y="11" fill="#64748B" font-family="sans-serif" font-size="5.5">Pages</text>
      <text x="99" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">36</text>
      <path d="M116 20 L121 16 L126 18 L131 14" fill="none" stroke="#8B5CF6" stroke-width="1.2" />
    </g>

    <!-- Laptop Keyboard Base (Perspective Extrusion) -->
    <path d="M-25 175 L305 175 L285 195 L-5 195 Z" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="95" y="177" width="90" height="4" rx="2" fill="#0F172A" />
    <rect x="115" y="183" width="50" height="8" rx="2" fill="#0F172A" />
  </g>

  <!-- Right: Floating Glass Feature Cubes -->
  <g transform="translate(378, 65)">
    <!-- CMS Cube -->
    <rect width="64" height="60" rx="14" fill="#0F1D38" stroke="#3B82F6" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- 3D Box Wireframe -->
    <path d="M32 14 L50 24 L32 34 L14 24 Z" fill="none" stroke="#60A5FA" stroke-width="1.5" />
    <path d="M14 24 L14 38 L32 48 L32 34 Z" fill="none" stroke="#3B82F6" stroke-width="1.5" />
    <path d="M50 24 L50 38 L32 48 L32 34 Z" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <text x="21" y="54" fill="#93C5FD" font-family="sans-serif" font-size="8" font-weight="700">CMS</text>
  </g>

  <g transform="translate(378, 140)">
    <!-- Fast Cube -->
    <rect width="64" height="60" rx="14" fill="#14133A" stroke="#8B5CF6" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Lightning Bolt -->
    <path d="M34 16 L22 30 L31 30 L28 44 L42 28 L32 28 Z" fill="#C084FC" stroke="#E879F9" stroke-width="1" />
    <text x="20" y="54" fill="#C084FC" font-family="sans-serif" font-size="8" font-weight="700">Fast</text>
  </g>
</svg>