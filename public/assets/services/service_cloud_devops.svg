<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C18" />
      <stop offset="100%" stop-color="#0B1528" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="awsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Dark Card Background with exact rounded corners and NO white border -->
  <rect width="460" height="280" rx="18" fill="url(#cloudBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Code Header -->
  <text x="24" y="36" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">// CLOUD_DEVOPS</text>

  <!-- Top Center: AWS Glowing Cloud -->
  <g transform="translate(185, 40)">
    <!-- Cloud Path -->
    <path d="M25 45 A 22 22 0 0 1 55 25 A 32 32 0 0 1 105 28 A 22 22 0 0 1 125 45 A 18 18 0 0 1 115 65 L 30 65 A 18 18 0 0 1 25 45 Z" fill="#0E1E38" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#cloudGlow)" />
    <path d="M25 45 A 22 22 0 0 1 55 25 A 32 32 0 0 1 105 28 A 22 22 0 0 1 125 45 A 18 18 0 0 1 115 65 L 30 65 A 18 18 0 0 1 25 45 Z" fill="#0E1E38" stroke="url(#cyanNeon)" stroke-width="1.5" />
    
    <!-- AWS Text -->
    <text x="56" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">aws</text>
    <path d="M54 58 Q72 65 92 58" fill="none" stroke="url(#awsGlow)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CI/CD Pipeline Section -->
  <g transform="translate(24, 115)">
    <!-- Pipeline Bar -->
    <rect width="280" height="48" rx="8" fill="#0E172A" stroke="#1E293B" stroke-width="1" />
    
    <!-- Step 1: Code -->
    <g transform="translate(12, 10)">
      <rect width="52" height="28" rx="6" fill="#1E293B" />
      <text x="14" y="18" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">&lt;/&gt;</text>
    </g>

    <!-- Arrow -->
    <path d="M72 24 L80 24" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 2: Build -->
    <g transform="translate(86, 10)">
      <rect width="52" height="28" rx="6" fill="#1E293B" />
      <circle cx="26" cy="14" r="7" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,2" />
    </g>

    <!-- Arrow -->
    <path d="M146 24 L154 24" stroke="#64748B" stroke-width="1.5" />

    <!-- Step 3: Test -->
    <g transform="translate(160, 10)">
      <rect width="52" height="28" rx="6" fill="#1E293B" />
      <circle cx="26" cy="14" r="7" fill="#10B981" />
      <path d="M22 14 L25 17 L30 11" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Arrow -->
    <path d="M220 24 L228 24" stroke="#64748B" stroke-width="1.5" />

    <!-- Step 4: Deploy -->
    <g transform="translate(234, 10)">
      <rect width="52" height="28" rx="6" fill="#0284C7" />
      <path d="M26 8 L29 16 L23 16 Z" fill="#FFFFFF" />
      <circle cx="26" cy="20" r="1.5" fill="#F59E0B" />
    </g>

    <text x="95" y="62" fill="#64748B" font-family="monospace" font-size="10" font-weight="600">CI / CD PIPELINE</text>
  </g>

  <!-- Right: Server Rack & Cloud Monitoring -->
  <g transform="translate(340, 65)">
    <!-- Server Chassis -->
    <rect width="95" height="185" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <!-- Server Blades -->
    <rect x="8" y="15" width="79" height="22" rx="4" fill="#1E293B" />
    <circle cx="20" cy="26" r="2.5" fill="#10B981" />
    <circle cx="28" cy="26" r="2.5" fill="#38BDF8" />

    <rect x="8" y="45" width="79" height="22" rx="4" fill="#1E293B" />
    <circle cx="20" cy="56" r="2.5" fill="#10B981" />
    <circle cx="28" cy="56" r="2.5" fill="#10B981" />

    <rect x="8" y="75" width="79" height="22" rx="4" fill="#1E293B" />
    <circle cx="20" cy="86" r="2.5" fill="#10B981" />
    <circle cx="28" cy="86" r="2.5" fill="#F59E0B" />

    <!-- Telemetry Graph Box -->
    <rect x="8" y="108" width="79" height="65" rx="6" fill="#080E1A" stroke="#38BDF8" stroke-width="1" />
    <path d="M14 150 L28 140 L42 146 L56 128 L72 135 L80 120" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    <text x="18" y="166" fill="#64748B" font-family="sans-serif" font-size="8">Live Health: 99.9%</text>
  </g>

  <!-- Bottom Left: Docker Whale & Linux -->
  <g transform="translate(24, 195)">
    <!-- Docker Whale -->
    <g transform="translate(0, 5)">
      <rect x="25" y="8" width="8" height="7" rx="1.5" fill="#0284C7" />
      <rect x="35" y="8" width="8" height="7" rx="1.5" fill="#0284C7" />
      <rect x="45" y="8" width="8" height="7" rx="1.5" fill="#0284C7" />
      <rect x="35" y="0" width="8" height="7" rx="1.5" fill="#0284C7" />
      <path d="M10 24 C10 18 20 16 55 16 C70 16 78 22 82 28 C75 32 50 35 25 35 C15 35 10 30 10 24 Z" fill="#38BDF8" />
      <circle cx="75" cy="22" r="1.5" fill="#0F172A" />
      <text x="90" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">Docker</text>
    </g>

    <!-- Linux Penguin Badge -->
    <g transform="translate(180, 5)">
      <rect width="80" height="30" rx="6" fill="#1E293B" />
      <text x="24" y="19" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Linux OS</text>
    </g>
  </g>
</svg>
